name: Build Notepad--

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        pip install pyinstaller
        # Tkinter is built-in on Windows/Mac runners, usually fine on Ubuntu runner

    - name: Build with PyInstaller (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconsole --onefile --icon="app_icon.ico" --add-data="app_icon.ico;." --name="notepad--" "notepad--.py"

    - name: Build with PyInstaller (Linux/Mac)
      if: runner.os != 'Windows'
      run: |
        # Use colon for separator and remove .ico icon flag for binary (optional)
        pyinstaller --noconsole --onefile --hidden-import=tkinter --add-data="app_icon.png:." --name="notepad--" "notepad--.py"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: Notepad--_${{ matrix.os }}
        path: dist/
